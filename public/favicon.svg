<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Logo de Hilos de Abuela: aguja e hilo sobre crema. Terracota #b0512a, dorado #c99a3f. -->
  <rect width="64" height="64" rx="14" fill="#faf4e8"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#b0512a" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- Aguja en diagonal -->
  <path d="M18 46 L44 20" stroke="#b0512a" stroke-width="4" stroke-linecap="round"/>
  <!-- Ojo de la aguja -->
  <circle cx="44" cy="20" r="3.2" fill="none" stroke="#faf4e8" stroke-width="2"/>
  <!-- Hilo dorado saliendo del ojo -->
  <path d="M44 20 C 50 28, 52 34, 46 40 C 42 44, 36 44, 34 40" fill="none" stroke="#c99a3f" stroke-width="2.6" stroke-linecap="round"/>
</svg>
