<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hilos de Abuela — costura hecha a mano: paños de cocina y de baño, muñecos de tela y abanicos. Pide por WhatsApp y paga al recibir."
    />
    <title>Hilos de Abuela — Costura hecha a mano</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Tema inicial antes de que cargue React (evita el parpadeo claro):
      // lo guardado en localStorage manda; si no hay nada, el sistema.
      try {
        var t = localStorage.getItem('hilos-theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
